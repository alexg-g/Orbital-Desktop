version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: orbital-postgres-dev
    environment:
      POSTGRES_USER: orbital_user
      POSTGRES_PASSWORD: orbital_dev_password
      POSTGRES_DB: orbital
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbital_user -d orbital"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
