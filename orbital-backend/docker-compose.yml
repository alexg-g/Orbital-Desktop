version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: orbital-postgres-dev
    environment:
      POSTGRES_USER: orbital_user
      POSTGRES_PASSWORD: orbital_dev_password
      POSTGRES_DB: orbital
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbital_user -d orbital"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:15-alpine
    container_name: orbital-postgres-test
    environment:
      POSTGRES_USER: orbital_test_user
      POSTGRES_PASSWORD: orbital_test_password
      POSTGRES_DB: orbital_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbital_test_user -d orbital_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_test_data:
